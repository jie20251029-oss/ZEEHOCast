name: Build iOS IPA

# 鎵嬪姩瑙﹀彂鍗冲彲锛沺ush 瑙﹀彂鐨勫畬鏁村弻绔瀯寤鸿浠撳簱鏍圭洰褰?.github/workflows/build.yml
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ZEEHOCast_iOS
        run: xcodegen generate

      - name: Build App
        working-directory: ZEEHOCast_iOS
        run: |
          xcodebuild -project ZEEHOCast.xcodeproj \
            -scheme ZEEHOCast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        working-directory: ZEEHOCast_iOS
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ZEEHOCast.app Payload/
          zip -r ZEEHOCast.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZEEHOCast-IPA
          if-no-files-found: error
          path: ZEEHOCast_iOS/ZEEHOCast.ipa
