name: Build iOS IPA

# 手动触发即可；push 触发的完整双端构建见仓库根目录 .github/workflows/build.yml
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ZEEHOCast_iOS
        run: xcodegen generate

      - name: Build App
        working-directory: ZEEHOCast_iOS
        run: |
          xcodebuild -project ZEEHOCast.xcodeproj \
            -scheme ZEEHOCast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA (unsigned)
        working-directory: ZEEHOCast_iOS
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ZEEHOCast.app Payload/
          zip -qry ZEEHOCast-unsigned.ipa Payload
          rm -rf Payload

      - name: Ad-hoc sign
        working-directory: ZEEHOCast_iOS
        run: |
          APP=build/Build/Products/Release-iphoneos/ZEEHOCast.app
          EXTA=$APP/PlugIns/ZEEHOCastBroadcast.appex
          /usr/bin/codesign --force --sign - --timestamp=none "$EXTA"
          /usr/bin/codesign --force --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --verbose=2 "$APP"

      - name: Package IPA (ad-hoc signed)
        working-directory: ZEEHOCast_iOS
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ZEEHOCast.app Payload/
          zip -qry ZEEHOCast-adhoc.ipa Payload
          rm -rf Payload
          ls -la *.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZEEHOCast-IPA
          if-no-files-found: error
          path: ZEEHOCast_iOS/*.ipa
