# XcodeGen 宸ョ▼瀹氫箟 鈥斺€?鍞竴浜嬪疄鏉ユ簮
#
# 閲嶈锛歵argets.*.info.properties 鐨勫唴瀹逛細琚?`xcodegen generate` **鍐欏叆骞惰鐩?*
# 瀵瑰簲璺緞鐨?Info.plist銆傛墍浠ヤ笉瑕佹墜鏀?App/Info.plist 鎴?BroadcastExtension/Info.plist锛?# 鏀硅繖閲屽啀閲嶆柊 generate銆?# 锛堟浘韪╁潙锛氬彧鍐欎簡 info.path 娌″啓 properties锛寈codegen 鐢ㄦ渶灏忔ā鏉胯鐩栦簡鎵嬪啓 plist锛?#   瀵艰嚧 NSExtension / NSLocalNetworkUsageDescription / UIBackgroundModes 鍏ㄩ儴涓㈠け锛?#   骞挎挱鎵╁睍鍙樻垚鏃犳晥鎵╁睍锛岄噸绛惧悗涔熸棤娉曟甯镐娇鐢ㄣ€傦級
name: ZEEHOCast
options:
  bundleIdPrefix: com.zeeho
  deploymentTarget:
    iOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    ENABLE_BITCODE: NO
    CODE_SIGN_REQUIRED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
targets:
  ZEEHOCast:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: 鏋佹牳鎶曞睆
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: 鐢ㄤ簬鎵弿浠〃杩炴帴浜岀淮鐮?        NSLocalNetworkUsageDescription: 鐢ㄤ簬鍙戠幇骞惰繛鎺ユ瀬鏍镐华琛?WiFi 杩涜鎶曞睆
        NSBonjourServices:
          - _EasyConn._tcp
        # 鐔勫睆鎶曞睆闈犲悗鍙板父椹伙紝缂鸿繖涓敭鐔勫睆鍚庝細琚郴缁熸寕璧?        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 鍗忚鏃ュ織瀵煎嚭鍒?Documents锛屾柟渚跨敤銆屾枃浠躲€岮pp 鍙栧嚭
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeeho.cast
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ZEEHOCastBroadcast
        embed: true
  ZEEHOCastBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes:
          - Info.plist
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: 鏋佹牳鎶曞睆骞挎挱
        CFBundlePackageType: "XPC!"
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        # ReplayKit 骞挎挱鎵╁睍蹇呴』澹版槑 NSExtension锛屽惁鍒欑郴缁熷箍鎾€夋嫨鍣ㄩ噷鐪嬩笉鍒帮紝
        # 閲嶇瀹夎涔熶細琚垽涓烘棤鏁堟墿灞曘€?        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeeho.cast.broadcast
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
