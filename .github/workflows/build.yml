name: Build ZEEHOCast (Android APK + iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Android APK
        working-directory: ZEEHOCast_Android
        run: gradle assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEEHOCast-APK
          path: ZEEHOCast_Android/app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ZEEHOCast_iOS
        run: xcodegen generate
      - name: Build iOS App
        working-directory: ZEEHOCast_iOS
        run: |
          xcodebuild -project ZEEHOCast.xcodeproj -scheme ZEEHOCast -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        working-directory: ZEEHOCast_iOS
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ZEEHOCast.app Payload/
          zip -r ZEEHOCast.ipa Payload
          rm -rf Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZEEHOCast-IPA
          path: ZEEHOCast_iOS/ZEEHOCast.ipa