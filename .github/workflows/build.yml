name: Build ZEEHOCast (Android APK + iOS IPA)

on:
  push:
    branches: [ main ]
    paths:
      - 'ZEEHOCast_Android/**'
      - 'ZEEHOCast_iOS/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: ZEEHOCast_Android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEEHOCast-APK
          if-no-files-found: error
          path: |
            ZEEHOCast_Android/app/build/outputs/apk/debug/*.apk
            ZEEHOCast_Android/app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ZEEHOCast_iOS
        run: xcodegen generate

      - name: Build iOS App
        working-directory: ZEEHOCast_iOS
        run: |
          xcodebuild -project ZEEHOCast.xcodeproj \
            -scheme ZEEHOCast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        working-directory: ZEEHOCast_iOS
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ZEEHOCast.app Payload/
          zip -r ZEEHOCast.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZEEHOCast-IPA
          if-no-files-found: error
          path: ZEEHOCast_iOS/ZEEHOCast.ipa
